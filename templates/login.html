{% extends "base.html" %}

{% block head %}
<title>Login</title>
{% endblock %}


{% block body %}
<div class="grid">
  <div class="card" style="max-width:420px; margin:auto;">
    <h3>Login</h3>
    <form method="POST">
      <input type="hidden" name="form_type" value="login">
      <div class="form-row">
        <input type="text" name="ku_id" placeholder="ku id">
        <button type="submit">Login</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
